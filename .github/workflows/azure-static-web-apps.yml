# main に変更が入るたびに、Azure Static Web Apps へ公開する。
# 必要な設定（GitHub のリポジトリ → Settings → Secrets and variables → Actions）
#   Secrets  : AZURE_STATIC_WEB_APPS_API_TOKEN（Azure の Static Web Apps の「デプロイ トークン」）
#   Variables: NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY（ブラウザに出してよい公開用の値）
# トークンが未設定のあいだは、何もせずに終わる。
name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment token
        id: check
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "AZURE_STATIC_WEB_APPS_API_TOKEN が未設定のため、公開をスキップします"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        uses: Azure/static-web-apps-deploy@v1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          app_build_command: npm run build:azure
          output_location: dist
          api_location: azure-api
          api_build_command: npm run build
